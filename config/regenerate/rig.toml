# Rig facts for tools/regenerate (ButlerMaster Land runs it on W; the build runs on the rig through Job Invoke). Paths are
# relative to the rig user's home. The generated paths and the command are declared in ../../config.toml [repo].
[rig]
# The host Name of ButlerMaster's Hosts that Job Invoke runs the build on.
host = "rig"
# The repository's registry name: the --Worktree the job runs in, <Root>/<board>.<card>/<repository> on the host.
repository = "Projects/AbuN64/RageWars"
# A tree whose ignored inputs the job's worktree links when it is created: the cartridge dumps.
seed_tree = "code/ragewars-decomp"
seed_link = ["roms"]
# Run in the job's worktree, in order; the first failure ends the run. One linker and one make check per regenerate:
# `unbake sync` after `unbake setup --no-make` finds the tree synced and only publishes (README.md, progress.json and
# docs, from the verdict `unbake verify` records for the exact tree), so it runs after the check. Job Invoke sets JOBS to
# Dos's width: the make width is Dos's, never a literal.
build = ['unbake setup --no-make', 'make -j"$JOBS" check', 'unbake verify 0', 'unbake sync']
# No timeout_seconds: a bound is a value its owner declares, and none has.
