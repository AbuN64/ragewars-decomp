schema = 4
name = "RageWars"
title = "Turok: Rage Wars"
toolchain = "gcc-2.8.1-sn64"
names_from = "us-rev1"
module_map = "docs/MODULES.tsv"
cppflags = ["-DF3DEX_GBI_2", "-Isdk/libgcc", "-Isdk/include"]
readme_map = "us-rev1"
readme_map_link = "https://itsmo.me/attic/cake-unbake/"
readme_map_repo = "ragewars-decomp"
[layout]
source_roots = ["src", "sdk"]
header_roots = ["include", "sdk/include"]
library_source = "sdk/{library}"
library_header = "sdk/include/{library}.h"
subsystem_source = "src/{subsystem}"
subsystem_header = "src/{subsystem}.h"

[cheat]
source = ["src", "include", "sdk"]
asm_home = ["sdk/"]
makefile_row = "^\\$\\(foreach v,\\$\\(VERSIONS\\),build/\\$\\(v\\)/(src|sdk)/[^ ]+\\.o\\): (TC|CPPFLAGS|CFLAGS) :="

