name: CI
on:  # progress sites read the report artifacts; main reports at most once a day, and only after a change
  schedule:
    - cron: "0 12 * * *"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  changed:
    runs-on: ubuntu-latest
    outputs:
      recent: ${{ steps.age.outputs.recent }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: age
        run: echo "recent=$(( $(date +%s) - $(git log -1 --format=%ct) < 86400 ))" >> "$GITHUB_OUTPUT"
  check:
    needs: changed
    if: github.event_name != 'schedule' || needs.changed.outputs.recent == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: make check CHECK=tree
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: de_report
          path: versions/de/report.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eu_report
          path: versions/eu/report.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eu-x_report
          path: versions/eu-x/report.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: us_report
          path: versions/us/report.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: us-rev1_report
          path: versions/us-rev1/report.json
          if-no-files-found: error
